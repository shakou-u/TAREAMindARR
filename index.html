<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindAR Interactivo - Minecraft</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #mensaje {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 12px;
      border-radius: 10px;
      z-index: 9999;
      font-family: Arial;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
    }
  </style>

</head>

<body>

  <!-- MENSAJE EN PANTALLA -->
  <div id="mensaje">
    Toca cualquier objeto!!!
  </div>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    
    <a-camera
      id="camara"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-entity
        id="steve"
        gltf-model="./sheep.glb?v=2"
        position="-0.35 0 0.1"
        rotation="0 0 0"
        scale="0.01 0.01 0.01">
      </a-entity>

     
      <a-box
        id="cubito"
        position="0 0 0.1"
        rotation="0 45 0"
        width="0.25"
        height="0.25"
        depth="0.25"
        color="#FF0000">
      </a-box>

     
      <a-entity
        id="warden"
        gltf-model="./warden.glb?v=1"
        position="0.35 0 0.1"
        rotation="0 0 0"
        scale="0.1 0.1 0.1">
      </a-entity>

    </a-entity>

  </a-scene>

  <script>

    // ELEMENTOS
    const escena = document.querySelector('a-scene');
    const cubito = document.querySelector('#cubito');
    const steve = document.querySelector('#steve');
    const warden = document.querySelector('#warden');
    const camara = document.querySelector('#camara');
    const mensaje = document.querySelector('#mensaje');
    const target = document.querySelector('#target');

    // COLORES DEL CUBITO
    const colores = [
      '#FF0000',
      '#00FF00',
      '#0000FF',
      '#FFFF00',
      '#FF00FF',
      '#00FFFF'
    ];

    let indice = 0;

    // OVEJITA GIRATORIA
    let girando = false;
    let angulo = 0;

    AFRAME.registerComponent('girar-oveja', {

      tick: function (time, delta) {

        if (girando) {

          angulo += delta * 0.05;

          steve.setAttribute(
            'rotation',
            `0 ${angulo} 0`
          );

        }

      }

    });

    steve.setAttribute('girar-oveja', '');

    // WARDEN QUE CRECE Y SE ENCOGE
    let wardenGrande = false;
const escalaNormal = 0.1;
const escalaGrande = 0.2;
    // Animación suave del Warden
    warden.setAttribute(
      'animation__crecer',
      {
        property: 'scale',
        startEvents: 'crecer',
        to: `${escalaGrande} ${escalaGrande} ${escalaGrande}`,
        dur: 500,
        easing: 'easeInOutQuad'
      }
    );

    warden.setAttribute(
      'animation__encoger',
      {
        property: 'scale',
        startEvents: 'encoger',
        to: `${escalaNormal} ${escalaNormal} ${escalaNormal}`,
        dur: 500,
        easing: 'easeInOutQuad'
      }
    );

    // DETECTAR TOQUES EN CELULAR
    escena.addEventListener('renderstart', function () {

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      escena.canvas.addEventListener('pointerdown', function (evento) {

        // No detectar objetos si no vemos el target
        if (!target.object3D.visible) {
          return;
        }

        const rect = escena.canvas.getBoundingClientRect();

        // POSICIÓN DEL DEDO
        mouse.x = ((evento.clientX - rect.left) / rect.width) * 2 - 1;

        mouse.y = -((evento.clientY - rect.top) / rect.height) * 2 + 1;

        // LANZAR RAYO DESDE LA CÁMARA
        raycaster.setFromCamera(
          mouse,
          camara.getObject3D('camera')
        );

        // DETECTAR LOS TRES OBJETOS
        const tocarCubo = raycaster.intersectObject(
          cubito.object3D,
          true
        );

        const tocarOveja = raycaster.intersectObject(
          steve.object3D,
          true
        );

        const tocarWarden = raycaster.intersectObject(
          warden.object3D,
          true
        );

        // Guardar los objetos tocados
        const objetosTocados = [];

        if (tocarCubo.length > 0) {
          objetosTocados.push({
            nombre: 'cubo',
            distancia: tocarCubo[0].distance
          });
        }

        if (tocarOveja.length > 0) {
          objetosTocados.push({
            nombre: 'oveja',
            distancia: tocarOveja[0].distance
          });
        }

        if (tocarWarden.length > 0) {
          objetosTocados.push({
            nombre: 'warden',
            distancia: tocarWarden[0].distance
          });
        }

        // Si no tocamos ningún objeto
        if (objetosTocados.length === 0) {
          return;
        }

        // Elegir el objeto más cercano al dedo
        objetosTocados.sort((a, b) => a.distancia - b.distancia);

        const objeto = objetosTocados[0].nombre;

        // INTERACCIÓN 1: CUBITO
        if (objeto === 'cubo') {

          indice = (indice + 1) % colores.length;

          cubito.setAttribute(
            'material',
            'color',
            colores[indice]
          );

          mensaje.textContent = 'Modo fiesta';

        }

        // INTERACCIÓN 2: OVEJITA
        else if (objeto === 'oveja') {

          girando = !girando;

          if (girando) {

            mensaje.textContent = 'oveja girandoo';

          } else {

            mensaje.textContent = 'ALTO';

          }

        }

        // INTERACCIÓN 3: WARDEN
        else if (objeto === 'warden') {

          wardenGrande = !wardenGrande;

          if (wardenGrande) {

            warden.emit('crecer');

            mensaje.textContent = 'El warden esta creciendooo';

          } else {

            warden.emit('encoger');

            mensaje.textContent = 'Mini warden';

          }

        }

      });

    });

  </script>

</body>
</html>
