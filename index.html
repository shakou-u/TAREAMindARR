<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindAR Interactivo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #mensaje {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 12px;
      border-radius: 10px;
      z-index: 9999;
      font-family: Arial;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
    }
  </style>

</head>

<body>

  <div id="mensaje">
    Toca el cubito rojo :DDDDD
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Cámara -->
    <a-camera
      id="camara"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Imagen target -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Cubito -->
      <a-box
        id="cubito"
        position="0 0 0.1"
        rotation="0 45 0"
        width="0.3"
        height="0.3"
        depth="0.3"
        color="#FF0000">
      </a-box>

    </a-entity>

  </a-scene>

  <script>

    const escena = document.querySelector('a-scene');
    const cubito = document.querySelector('#cubito');
    const camara = document.querySelector('#camara');
    const mensaje = document.querySelector('#mensaje');

    const colores = [
      '#FF0000',
      '#00FF00',
      '#0000FF',
      '#FFFF00',
      '#FF00FF',
      '#00FFFF'
    ];

    let indice = 0;

    escena.addEventListener('renderstart', function () {

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      // Detectar cuando el dedo toca la pantalla
      escena.canvas.addEventListener('pointerdown', function (evento) {

        const rect = escena.canvas.getBoundingClientRect();

        // Obtener posición del dedo
        mouse.x = ((evento.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((evento.clientY - rect.top) / rect.height) * 2 + 1;

        // Lanzar un rayo desde la cámara
        raycaster.setFromCamera(mouse, camara.getObject3D('camera'));

        // Detectar si tocamos el cubito
        const intersecciones = raycaster.intersectObject(
          cubito.object3D,
          true
        );

        if (intersecciones.length > 0) {

          indice = (indice + 1) % colores.length;

          cubito.setAttribute('material', 'color', colores[indice]);

          mensaje.textContent = 'HZLO DE NUEVOO ';

          console.log('Cubito tocado correctamente');

        }

      });

    });

  </script>

</body>
</html>
