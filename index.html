<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindAR Interactivo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #mensaje {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 12px;
      border-radius: 10px;
      z-index: 9999;
      font-family: Arial;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
    }
  </style>

</head>

<body>

  <div id="mensaje">
    ¡Toca el cubito o a Steve! 👆
  </div>

  <!-- ESCENA DE REALIDAD AUMENTADA -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- CÁMARA -->
    <a-camera
      id="camara"
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- IMAGEN TARGET -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- STEVE -->
      <a-entity
        id="steve"
        gltf-model="./steve.glb"
        position="-0.3 0 0.1"
        rotation="0 0 0"
        scale="0.1 0.1 0.1">
      </a-entity>

      <!-- CUBITO -->
      <a-box
        id="cubito"
        position="0.3 0 0.1"
        rotation="0 45 0"
        width="0.3"
        height="0.3"
        depth="0.3"
        color="#FF0000">
      </a-box>

    </a-entity>

  </a-scene>

  <script>

    const escena = document.querySelector('a-scene');
    const cubito = document.querySelector('#cubito');
    const steve = document.querySelector('#steve');
    const camara = document.querySelector('#camara');
    const mensaje = document.querySelector('#mensaje');

    // COLORES DEL CUBITO
    const colores = [
      '#FF0000',
      '#00FF00',
      '#0000FF',
      '#FFFF00',
      '#FF00FF',
      '#00FFFF'
    ];

    let indice = 0;

    // CONTROL DE STEVE
    let girando = false;
    let angulo = 0;

    // HACER GIRAR A STEVE
    AFRAME.registerComponent('girar-steve', {

      tick: function (time, delta) {

        if (girando) {

          angulo += delta * 0.05;

          steve.setAttribute(
            'rotation',
            `0 ${angulo} 0`
          );

        }

      }

    });

    steve.setAttribute('girar-steve', '');

    // DETECTAR TOQUES
    escena.addEventListener('renderstart', function () {

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      escena.canvas.addEventListener('pointerdown', function (evento) {

        const rect = escena.canvas.getBoundingClientRect();

        mouse.x = ((evento.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((evento.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(
          mouse,
          camara.getObject3D('camera')
        );

        // DETECTAR CUBITO
        const tocarCubo = raycaster.intersectObject(
          cubito.object3D,
          true
        );

        // DETECTAR STEVE
        const tocarSteve = raycaster.intersectObject(
          steve.object3D,
          true
        );

        if (tocarCubo.length > 0 &&
            (tocarSteve.length === 0 ||
             tocarCubo[0].distance < tocarSteve[0].distance)) {

          indice = (indice + 1) % colores.length;

          cubito.setAttribute(
            'material',
            'color',
            colores[indice]
          );

          mensaje.textContent = '¡EL CUBITO CAMBIÓ DE COLOR! 🌈';

        }

        else if (tocarSteve.length > 0) {

          girando = !girando;

          if (girando) {
            mensaje.textContent = '¡STEVE ESTÁ GIRANDO! 🔄';
          } else {
            mensaje.textContent = '¡STEVE SE DETUVO! 🛑';
          }

        }

      });

    });

  </script>

</body>
</html>
