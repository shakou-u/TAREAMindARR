<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MindAR Interactivo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente que cambia el color del cubito
    AFRAME.registerComponent('cambiar-color', {

      init: function () {

        const cubo = this.el;

        const colores = [
          '#FF0000',
          '#00FF00',
          '#0000FF',
          '#FFFF00',
          '#FF00FF',
          '#00FFFF'
        ];

        let indice = 0;

        cubo.addEventListener('click', function () {

          indice = (indice + 1) % colores.length;

          // Cambiar color del cubito
          cubo.setAttribute('material', 'color', colores[indice]);

          // Mostrar mensaje en pantalla
          document.getElementById('mensaje').textContent =
            '¡TOCASTE EL CUBITO! 🌈';

          console.log('¡El cubo cambió de color!');

        });

      }

    });
  </script>

</head>

<body style="margin: 0; overflow: hidden;">

  <!-- Mensaje en pantalla -->
  <div id="mensaje"
    style="
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 12px;
      border-radius: 10px;
      z-index: 9999;
      font-family: Arial;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
    ">
    Toca el cubito rojo 👆
  </div>

  <!-- Escena de realidad aumentada -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Cámara que detecta los toques -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse; fuse: false;"
      raycaster="objects: .interactivo; far: 1000;">
    </a-camera>

    <!-- Imagen que reconoce MindAR -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Cubito mágico -->
      <a-box
        class="interactivo"
        cambiar-color
        position="0 0 0.1"
        rotation="0 45 0"
        width="0.3"
        height="0.3"
        depth="0.3"
        color="#FF0000">
      </a-box>

    </a-entity>

  </a-scene>

</body>
</html>
